<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Flask and MongoDB form</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><main class="card"><p class="eyebrow">TuteDude · Flask + MongoDB Atlas</p><h1>Send a message</h1><p class="intro">Valid submissions are stored in MongoDB Atlas.</p>{% if error %}<div class="alert" role="alert">{{ error }}</div>{% endif %}<form method="post" action="{{ url_for('submit') }}"><label for="name">Name</label><input id="name" name="name" required maxlength="100" value="{{ values.get('name','') }}"><label for="email">Email</label><input id="email" name="email" type="email" required maxlength="254" value="{{ values.get('email','') }}"><label for="message">Message</label><textarea id="message" name="message" required maxlength="2000">{{ values.get('message','') }}</textarea><button>Submit message</button></form><p class="api-note">JSON endpoint: <a href="/api">/api</a></p></main></body></html>
